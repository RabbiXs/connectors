[project]
name = "rabbix-claude-agent-sdk"
version = "0.1.0"
description = "RabbiX checkpoint for the Claude Agent SDK."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["rabbix==0.1.0", "claude-agent-sdk>=0.2.168"]
classifiers = ["Typing :: Typed"]

[project.urls]
Repository = "https://github.com/RabbiXs/connectors"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
