[project]
name = "rabbix-workspace"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "rabbix",
    "rabbix-openai-agents",
    "rabbix-agent-framework",
    "rabbix-claude-agent-sdk",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
rabbix = { workspace = true }
rabbix-openai-agents = { workspace = true }
rabbix-agent-framework = { workspace = true }
rabbix-claude-agent-sdk = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.pyright]
include = ["packages"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# Third-party framework packages are not fully typed.
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
