openapi: 3.1.0
info:
  title: RabbiX Checkpoint API
  version: 0.1.0
  summary: The single call an autonomous agent makes at the end of a run.
  description: |
    An agent submits its **goal** and its **final result** to the checkpoint
    before anything acts on the result. RabbiX answers with a verdict.

    This spec is the source of truth for every SDK in this repository.
    **The API is not live yet.** The server URL below is a placeholder on the
    reserved `.invalid` TLD and never resolves.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://api.rabbix.invalid
    description: Placeholder until the real endpoint exists. Override with RABBIX_BASE_URL.
security:
  - apiKey: []
paths:
  /v1/checkpoints:
    post:
      operationId: createCheckpoint
      summary: Submit a run's goal and final result for a verdict
      description: |
        `200` means RabbiX decided synchronously (verdict is final).
        `202` means a human is reviewing; poll `GET /v1/checkpoints/{decisionId}`.

        Bodies larger than 8 KB SHOULD be sent with `Content-Encoding: gzip`.
        The uncompressed body MUST NOT exceed 10 MB (10 485 760 bytes); `goal` and
        `result` have no limits of their own. JSON nesting deeper than 64 levels is
        rejected with `400` (`validation_failed`).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID generated once per checkpoint call and reused on every retry of that call.
          schema: { type: string, format: uuid }
        - name: Content-Encoding
          in: header
          required: false
          schema: { type: string, enum: [gzip] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckpointRequest' }
      responses:
        '200':
          description: Final verdict, decided synchronously.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verdict' }
        '202':
          description: Pending human review. Poll the decision.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verdict' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: Agent disabled or tenant suspended (code `agent_disabled` / `tenant_suspended`). Do not retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415':
          description: Body is not `application/json`, or `Content-Encoding` is not gzip (code `unsupported_media_type`). Do not retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Idempotency-Key reused with a different body (code `idempotency_mismatch`). Do not retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Retryable' }
        '5XX': { $ref: '#/components/responses/Retryable' }
  /v1/checkpoints/{decisionId}:
    get:
      operationId: getCheckpoint
      summary: Get the current verdict of a decision
      description: 'Returns `status: PENDING` until the decision is final.'
      parameters:
        - name: decisionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current verdict.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Verdict' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: Agent disabled or tenant suspended (code `agent_disabled` / `tenant_suspended`). Do not retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Retryable' }
        '5XX': { $ref: '#/components/responses/Retryable' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: 'API key sent as `Authorization: Bearer <key>`.'
  headers:
    RetryAfter:
      description: Seconds the client should wait before the next request.
      schema: { type: integer, minimum: 0 }
  responses:
    Error:
      description: Non-retryable error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Retryable:
      description: Retryable error. Retry with the same Idempotency-Key.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CheckpointRequest:
      type: object
      required: [goal, result]
      description: Properties not listed here are ignored by the Gateway, so SDKs can send fields ahead of it.
      properties:
        goal:
          type: string
          minLength: 1
          description: What the agent was asked to do (instructions and task input).
        result:
          description: The agent's final result, in full. Never truncated by the SDK.
          oneOf:
            - type: string
            - type: object
            - type: array
        decisionClass:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9][a-z0-9-]*$'
          description: Category with shared rules and thresholds, e.g. `refund`, `price-change`. Unknown classes are accepted.
        agent:
          $ref: '#/components/schemas/AgentInfo'
        metadata:
          type: object
          maxProperties: 50
          propertyNames: { maxLength: 64, pattern: '^[A-Za-z0-9_.-]+$' }
          additionalProperties: { type: string, maxLength: 512 }
          description: Free-form string pairs supplied by the integrator. The SDK adds nothing here.
    AgentInfo:
      type: object
      properties:
        name: { type: string, maxLength: 128 }
        framework:
          type: [string, 'null']
          enum: [openai-agents, agent-framework, claude-agent-sdk, null]
    Verdict:
      type: object
      required: [decisionId, status]
      properties:
        decisionId: { type: string }
        status:
          type: string
          enum: [APPROVED, REJECTED, MODIFIED, EXPIRED, PENDING]
          description: |
            APPROVED / MODIFIED: the host may act (on `result` if MODIFIED).
            REJECTED / EXPIRED: the host must not act.
            PENDING: not final; keep polling.
        route:
          type: string
          enum: [AI_AUTONOMOUS, HUMAN_IN_LOOP, HUMAN_ONLY]
        result:
          description: Present when status is MODIFIED; the edited result to act on instead.
        reason:
          type: [string, 'null']
          description: Human- or policy-supplied explanation.
    Error:
      type: object
      required: [code, message]
      description: |
        Clients decide by HTTP status; `code` adds detail. New codes may be added
        at any time, so treat an unknown code by its status class.

        | Status | code |
        |---|---|
        | 400 | `validation_failed` (schema, limits, malformed JSON, missing or invalid `Idempotency-Key`) |
        | 401 | `invalid_api_key` (missing, malformed, unknown, revoked or expired) |
        | 403 | `agent_disabled`, `tenant_suspended` |
        | 404 | `decision_not_found` |
        | 413 | `payload_too_large` |
        | 415 | `unsupported_media_type` |
        | 422 | `idempotency_mismatch` |
        | 429 | `rate_limited`, `idempotency_in_flight` |
        | 500 | `internal_error` |
        | 503 | `service_unavailable` |
      properties:
        code: { type: string }
        message:
          type: string
          description: Human-readable, English. Never contains submitted content.
        traceId:
          type: string
          description: W3C trace id of the request, for support.
